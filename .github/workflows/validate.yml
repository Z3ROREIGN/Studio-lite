name: Studio Lite Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate HTML structure
        run: node -e "const fs=require('fs'); const s=fs.readFileSync('index.html','utf8'); if(!/^<!doctype html>/i.test(s.trim())) process.exit(1); for(const x of ['style.css','app.js']) if(!fs.existsSync(x)) process.exit(1); console.log('Studio Lite static validation OK')"
